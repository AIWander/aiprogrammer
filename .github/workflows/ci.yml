name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin kit
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/validate-repository.ps1
      - name: Validate shared plugin-package contract
        shell: pwsh
        run: ./scripts/validate-plugin-package.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test the guard policy
        run: python plugins/programmer/tests/test_programmer_policy.py
